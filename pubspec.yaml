name: zuraffa_code_editor
description: >-
  A customizable Flutter code field supporting syntax highlighting, code
  folding with visible closing lines, autocompletion and themes.
version: 0.1.0
repository: https://github.com/arrrrny/zuraffa_code_editor
homepage: https://zuraffa.com
issue_tracker: https://github.com/arrrrny/zuraffa_code_editor/issues
topics:
  - flutter
  - code-editor
  - syntax-highlighting
  - code-folding
  - zuraffa

environment:
  sdk: ">=2.17.0 <4.0.0"
  flutter: ">=3.0.0"

dependencies:
  autotrie: ^2.0.0
  characters: ^1.2.1
  charcode: ^1.3.1
  collection: ^1.17.2
  equatable: ^2.0.5
  flutter: { sdk: flutter }
  flutter_highlight: ^0.7.0
  highlight: ^0.7.0
  http: ^1.1.0
  linked_scroll_controller: ^0.2.0
  meta: ^1.9.1
  mocktail: ^1.0.1
  scrollable_positioned_list: ^0.3.5
  tuple: ^2.0.1
  url_launcher: ^6.1.8

dev_dependencies:
  fake_async: ^1.3.1
  flutter_lints: ^6.0.0
  flutter_test: { sdk: flutter }

flutter:
  uses-material-design: true
