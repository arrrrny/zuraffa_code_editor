name: Dart-CI-Pipeline

on:
  push:
    branches: [ '**' ]
  pull_request:
    branches: [ '**' ]

env:
  flutter_version: 3.47.5

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Cache Flutter dependencies
        uses: actions/cache@v3
        with:
          path: /opt/hostedtoolcache/flutter
          key: ${{ runner.OS }}-flutter-install-cache-${{ env.flutter_version }}
          restore-keys: ${{ runner.OS }}-flutter-install-cache

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.flutter_version }}

      - run: flutter --version

      - run: flutter clean

      - name: Install Dependencies
        run: flutter pub get

      - run: flutter pub outdated

      - name: Analyze
        run: dart analyze --fatal-infos

      - name: Format
        run: dart format --output=none --set-exit-if-changed .

      - name: Create helper file for coverage results
        run: |
          file=test/coverage_helper_test.dart
          echo "// Helper file to make coverage work for all dart files\n" > $file
          echo "// ignore_for_file: unused_import, directives_ordering" >> $file

          find lib ! -name '*_web.dart' -name '*dart' | \
            cut -c4- | \
            awk -v package=$1 '{printf "import '\''package:zuraffa_code_editor%s%s'\'';\n", package, $1}' >> $file
          echo "void main(){}" >> $file
          echo "\n"
          cat $file
          echo "\n"

      - name: Test
        run: flutter test --coverage

      # Ratchet: the number only ever rises, and only in the PR that adds the
      # tests behind it — the step below refuses a PR that lowers it.
      # Measured on this branch with a fresh coverage run and the CI helper:
      # 97.89% (2920/2983 lines). Unreachable files are exempted (see
      # EXEMPT_FILES in tool/coverage_gate.py): the CI helper imports every
      # file under lib/, so dead/wip modules the package never references
      # would otherwise drag the number down. The gate sits just under the
      # measured value so master is green and every coverage PR raises it.
      - name: Coverage gate
        run: |
          python3 tool/coverage_gate.py --min 97.7
          # Mechanical ratchet: fail a PR that lowers the gate below the base
          # branch's value. GITHUB_BASE_REF is empty on push events, where
          # there is nothing to compare against. Both sides are read with the
          # same grep, first match = the gate invocation line above.
          this_min="$(grep -m1 -oE 'min [0-9.]+' .github/workflows/dart.yaml | cut -d' ' -f2)"
          if [ -n "$GITHUB_BASE_REF" ]; then
            git fetch --quiet origin "$GITHUB_BASE_REF"
            base_min="$(git show "origin/$GITHUB_BASE_REF:.github/workflows/dart.yaml" 2>/dev/null | grep -m1 -oE 'min [0-9.]+' | cut -d' ' -f2)" || true
            if [ -n "$base_min" ] && ! awk -v a="$this_min" -v b="$base_min" 'BEGIN { exit !(a + 0 >= b + 0) }'; then
              echo "::error::coverage gate lowered: --min $this_min < --min $base_min (base $GITHUB_BASE_REF)"
              exit 1
            fi
          fi

      # As we don't use file generation, it's fine to include everything.
      # - name: Install lcov
      #   run: sudo apt-get install -y lcov
      #
      # - name: Remove generated files from coverage results
      #   run: |
      #     lcov --remove coverage/lcov.info \
      #     'lib/*/*freezed.dart' \
      #     'lib/*/*.g.dart' \
      #     'lib/*/*.part.dart' \
      #     'lib/generated/*.dart' \
      #     'lib/generated/*/*.dart' -o coverage/lcov.info

      - name: Codecov
        uses: codecov/codecov-action@v3
        with:
          file: coverage/lcov.info
