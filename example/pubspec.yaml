name: example
description: Example
publish_to: 'none'
version: 7.2.0

environment:
  sdk: '>=3.11.0 <4.0.0'
  flutter: ">=3.41.0"

dependencies:
  flutter: { sdk: flutter }
  zuraffa_code_editor: { path: ../ }
  flutter_highlight: ^0.7.0
  highlight: ^0.7.0
  http: ^1.1.0

dev_dependencies:
  flutter_test: { sdk: flutter }
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/settings/autoRefactoringSettings.json

# Fleet-wide xml policy: pin the override to the latest xml so graphs that
# still transitively pull the abandoned minio (xml 6.x) resolve cleanly.
dependency_overrides:
  xml: 7.1.0
